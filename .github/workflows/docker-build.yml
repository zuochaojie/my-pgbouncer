name: Build and Push

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          #platforms: linux/amd64,linux/arm64,linux/s390x
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pgbouncer:1.25.2
            ${{ secrets.DOCKER_USERNAME }}/pgbouncer:${{ github.ref_name }}
            ${{ secrets.ALIYUN_REGISTRY }}/chaojiezuo/chaojiezuo:pgbouncer:1.25.2
            ${{ secrets.ALIYUN_REGISTRY }}/chaojiezuo/chaojiezuo:pgbouncer-${{ github.sha }}